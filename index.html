<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание класса</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pangolin&display=swap">
<style>
:root{--bg:#1a1245;--card:#271a63;--ink:#ffffff;--mute:#b9abf2;--line:#412d96;--accent:#ff3d9a;--hl:#ffe92e;--hlink:#1a1245;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1245;--card:#271a63;--ink:#ffffff;--mute:#b9abf2;--line:#412d96;--accent:#ff3d9a;--hl:#f2cf4a;--hlink:#1c2340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1245;--card:#271a63;--ink:#ffffff;--mute:#b9abf2;--line:#412d96;--accent:#ff3d9a;--hl:#f2cf4a;--hlink:#1c2340;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.7rem;margin:0;letter-spacing:-.02em}
.sub{color:var(--mute);margin:2px 0 18px}
.now{background:linear-gradient(135deg,#ff3d9a,#8a3dff 55%,#18b6ff);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:18px}
.now b{display:block;font-size:1.15rem}
.now span{opacity:.85;font-size:.92rem}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:#ffe92e;color:#1a1245;border-color:#ffe92e}
.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lesson{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.lesson .t{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--mute)}
.lesson .t strong{display:block;color:var(--ink);font-size:1rem}
.lesson h3{margin:0;font-size:1.05rem}
.lesson p{margin:2px 0 0;color:var(--mute);font-size:.9rem}
.lesson.on{background:#0e0a2b;border-color:#ffe92e;color:#fff}
.lesson.on .t,.lesson.on .t strong,.lesson.on p{color:#e6e9ff}
.lesson.done{opacity:.5}
h2{font-size:1.1rem;margin:28px 0 10px}
.note{background:var(--card);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.note small{color:var(--mute);display:block}
.empty{color:var(--mute);padding:20px 0;text-align:center}
.rb{display:inline-block;background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent;font-family:"Pangolin","Comic Sans MS",cursive,sans-serif;font-weight:700;filter:drop-shadow(1px 0 0 #1c2340) drop-shadow(-1px 0 0 #1c2340) drop-shadow(0 1px 0 #1c2340) drop-shadow(0 -1px 0 #1c2340)}
h1 .rb{font-size:2.3rem;line-height:1.15}
.lesson h3 .rb{font-size:1.3rem}
.st{display:inline-block;line-height:1}
.st .w{display:inline-block;white-space:nowrap;margin-right:.3em}
.st img{height:auto;vertical-align:bottom;margin:0 .02em}
h1 .st{font-size:2.3rem}
.lesson h3 .st{font-size:1.4rem}
.dev{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:4px solid #18d6a0;border-radius:14px;padding:14px 16px}
.dev b{display:block;font-size:1.1rem;letter-spacing:.02em}
.dev span{color:var(--mute);font-size:.9rem}
.dev:focus-visible{outline:3px solid #ffe92e;outline-offset:2px}
.menu{display:flex;gap:6px;margin-bottom:16px}
.menu button{flex:1;padding:10px 0;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
.menu button[aria-pressed="true"]{background:#ff3d9a;border-color:#ff3d9a;color:#fff}
.menu button:focus-visible{outline:3px solid #ffe92e;outline-offset:2px}
.by{margin-top:32px;text-align:center;color:var(--mute);font-size:.9rem}
main{position:relative}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(26,18,69,.35),rgba(26,18,69,.7))}
.fox{position:absolute;right:-12%;bottom:-6%;width:min(120vw,720px);filter:blur(8px);opacity:.55;animation:float 7s ease-in-out infinite}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5}
.b1{width:60vmax;height:60vmax;left:-20vmax;top:-20vmax;background:#ff3d9a;animation:drift 18s ease-in-out infinite alternate}
.b2{width:50vmax;height:50vmax;right:-15vmax;top:20vh;background:#18b6ff;animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-22px) rotate(2deg)}}
@keyframes drift{to{transform:translate(8vmax,6vmax)}}
.earL,.earR{transform-box:fill-box;transform-origin:50% 100%;animation:twitch 6s infinite}
.earR{animation-delay:-3s}
@keyframes twitch{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-7deg)}94%{transform:rotate(3deg)}}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.lesson,.note,.dev{background:rgba(39,26,99,.78);backdrop-filter:blur(6px)}
@media (prefers-reduced-motion:reduce){.fox,.blob,.earL,.earR,.eyes{animation:none}}
.fox{left:0;right:0;margin:0 auto;bottom:0;width:auto;height:92vh;filter:blur(5px);opacity:.7}
.tail{transform-box:fill-box;transform-origin:10% 80%;animation:wag 2.4s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@media (prefers-reduced-motion:reduce){.tail{animation:none}}
</style>
</head>

<script>
/* ===== РЕДАКТИРУЙТЕ ТОЛЬКО ЭТОТ БЛОК ===== */
const CLASS_NAME = "10 «А»";
// Время уроков: [начало, конец]
const BELLS_MON = [["08:30","09:00"],["09:10","09:50"],["10:10","10:50"],["11:10","11:50"],["12:05","12:45"],["13:00","13:40"],["13:50","14:30"],["14:35","15:15"]];
const BELLS_OTHER = [["08:30","09:10"],["09:20","10:00"],["10:20","11:00"],["11:20","12:00"],["12:15","12:55"],["13:10","13:50"],["14:00","14:40"],["14:45","15:25"]];
const bellsFor = d => d === 1 ? BELLS_MON : BELLS_OTHER;
// Предмет, кабинет, учитель. Номер урока = позиция в списке.
const SCHEDULE = {
  1:[["Разговоры о важном","406"],["История","403"],["Литература","406"],["Алгебра","309"],["География","401"],["Основы психологии","303"],["Английский язык","300/306"]],
  2:[["Русский язык","406"],["Алгебра","309"],["Обществознание","402"],["Обществознание","402"],["Английский язык","300/306"],["Вероятность и статистика","309"],["Физкультура",""]],
  3:[["Физика","219"],["Английский язык","300/306"],["Информатика","113/114"],["Геометрия","309"],["Русский язык","406"],["Литература","406"],["Основы педагогики","301"]],
  4:[["Обществознание","402"],["Обществознание","402"],["Геометрия","309"],["Алгебра","309"],["Литература","406"],["Биология","215"],["Физкультура",""]],
  5:[["Алгебра","309"],["Геометрия","309"],["Физика","219"],["ОБЗР","204"],["История","403"],["Индивидуальный проект","113"],["Химия","224"]]
};
const NOTES = [];
// Учителя: [предмет, ФИО]
const TEACHERS = [
  ["Алгебра","Киселевич Дарья Яковлевна"],
  ["Геометрия","Киселевич Дарья Яковлевна"],
  ["Вероятность и статистика","Киселевич Дарья Яковлевна"],
  ["Биология","Чудовская Ольга Васильевна"],
  ["География","Клочкова Оксана Владимировна"],
  ["Индивидуальный проект","Клепча Марина Юрьевна"],
  ["Иностранный язык (английский)","Юдаева Антонина Александровна"],
  ["Информатика","Зайнулина Ольга Сергеевна"],
  ["История","Степанова Светлана Викторовна"],
  ["Литература","Фомина Марина Дмитриевна"],
  ["Обществознание","Гаврилюк Анна Владимировна"],
  ["Основы безопасности и защиты Родины","Червоный Юрий Владимирович"],
  ["Основы педагогики","Лебедева Галина Сергеевна"],
  ["Основы психологии","Лебедева Галина Сергеевна"],
  ["Русский язык","Фомина Марина Дмитриевна"],
  ["Разговоры о важном","Фомина Марина Дмитриевна"],
  ["Физика","Хляпова Светлана Яковлевна"],
  ["Физическая культура","Назаров Евгений Владимирович"],
  ["Химия","Лекомцева Ольга Леонидовна"]
];
// Короткие названия в расписании -> полные в списке учителей
const ALIAS = {"Физкультура":"Физическая культура","Английский язык":"Иностранный язык (английский)","ОБЗР":"Основы безопасности и защиты Родины"};
function teacherFor(name){
  const t = TEACHERS.find(x => x[0] === (ALIAS[name] || name));
  if (!t) return null;
  const p = t[1].split(" ");
  return p.length === 3 ? p[0] + " " + p[1][0] + ". " + p[2][0] + "." : t[1];
}
/* ======================================== */

const DAYS = ["Пн","Вт","Ср","Чт","Пт"];
const FULL = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function rainbow(text){
  let k = 0;
  return [...String(text)].map(ch => {
    if (ch === " ") return " ";
    const h = (k++ * 47 + 300) % 360;
    const c = esc(ch);
    return `<span class="rb" style="background-image:linear-gradient(180deg,hsl(${h} 95% 58%),hsl(${(h+70)%360} 95% 55%),hsl(${(h+140)%360} 95% 55%))">${c}</span>`;
  }).join("");
}

function stickers(text){
  const words = String(text).split(" ");
  const html = words.map(w => "<span class=\"w\">" + [...w].map(ch => {
    const u = ch.toUpperCase(), g = LETTERS[u];
    if (g) return `<img src="${g[2]}" alt="" style="width:${(g[0]/110).toFixed(3)}em;height:${(g[1]/110).toFixed(3)}em">`;
    return rainbow(ch);
  }).join("") + "</span>").join(" ");
  return `<span class="st" role="img" aria-label="${esc(text)}">${html}</span>`;
}

let today = new Date().getDay();
let sel = (today >= 1 && today <= 5) ? today : 1;

function render(){
  const d = new Date();
  const mins = d.getHours()*60 + d.getMinutes();
  const isToday = sel === today;
  document.getElementById("title").innerHTML = stickers("Расписание " + CLASS_NAME);
  document.getElementById("sub").textContent = "Сегодня " + FULL[today] + ", " + d.toLocaleDateString("ru-RU",{day:"numeric",month:"long"});

  document.getElementById("tabs").innerHTML = DAYS.map((n,i) =>
    `<button role="tab" data-d="${i+1}" aria-selected="${sel===i+1}">${n}</button>`).join("");

  const day = SCHEDULE[sel] || [];
  document.getElementById("list").innerHTML = day.length ? day.map((l,i) => {
    const b = bellsFor(sel)[i] || ["",""];
    let cls = "";
    if (isToday && b[0]) {
      if (mins >= toMin(b[0]) && mins < toMin(b[1])) cls = "on";
      else if (mins >= toMin(b[1])) cls = "done";
    }
    return `<div class="lesson ${cls}"><div class="t"><strong>${b[0]}</strong>${b[1]}</div>
      <div><h3>${i+1}. ${stickers(l[0])}</h3><p>${esc([l[1] ? "Каб. " + l[1] : "", teacherFor(l[0]) || ""].filter(Boolean).join(" · "))}</p></div></div>`;
  }).join("") : `<div class="empty">В этот день уроков нет</div>`;

  const now = document.getElementById("now");
  now.hidden = true;
  if (today >= 1 && today <= 5) {
    const t = SCHEDULE[today] || [];
    const BL = bellsFor(today);
    for (let i = 0; i < t.length && BL[i]; i++) {
      const s = toMin(BL[i][0]), e = toMin(BL[i][1]);
      if (mins < e) {
        now.hidden = false;
        now.innerHTML = mins >= s
          ? `<b>Сейчас: ${esc(t[i][0])}</b><span>${t[i][1] ? "Каб. " + esc(t[i][1]) + ", " : ""}до конца ${e-mins} мин</span>`
          : `<b>Дальше: ${esc(t[i][0])}</b><span>${t[i][1] ? "Каб. " + esc(t[i][1]) + ", " : ""}через ${s-mins} мин (в ${BL[i][0]})</span>`;
        break;
      }
    }
    if (now.hidden && t.length) { now.hidden = false; now.innerHTML = "<b>На сегодня уроки закончились</b>"; }
  }

  document.getElementById("notes").innerHTML = NOTES.length
    ? NOTES.map(n => `<div class="note"><b>${esc(n[0])}</b><small>${esc(n[1])}</small></div>`).join("")
    : `<div class="empty">Пока ничего нет</div>`;
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) { sel = Number(b.dataset.d); render(); }
});
document.getElementById("teachers").innerHTML = TEACHERS.map(t =>
  `<div class="note"><b>${esc(t[0])}</b><small>${esc(t[1])}</small></div>`).join("");

document.getElementById("menu").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const v = b.dataset.v;
  document.getElementById("view-schedule").hidden = v !== "schedule";
  document.getElementById("view-teachers").hidden = v !== "teachers";
  document.getElementById("view-dev").hidden = v !== "dev";
  document.querySelectorAll("#menu button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
});
render();
setInterval(render, 30000);
</script>
